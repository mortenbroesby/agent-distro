name: verify

on:
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - run: npm run fmt:check
      - run: npm run lint
      - run: npm test
      - run: npm run test:proof
      - name: Copilot marketplace smoke
        run: |
          copilot_home="$(mktemp -d)"
          export COPILOT_HOME="$copilot_home"
          npm exec --yes --package @github/copilot@1.0.75 -- copilot plugin marketplace add .
          npm exec --yes --package @github/copilot@1.0.75 -- copilot plugin marketplace browse agent-distro-marketplace
          npm exec --yes --package @github/copilot@1.0.75 -- copilot plugin install agent-distro@agent-distro-marketplace
          npm exec --yes --package @github/copilot@1.0.75 -- copilot plugin list
          test -f "$COPILOT_HOME/installed-plugins/agent-distro-marketplace/agent-distro/skills/agent-distro-foundation/SKILL.md"

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - run: npm run fmt:check
      - run: npm run lint
      - run: npm test
      - run: npm run test:proof
      - name: Copilot marketplace smoke
        run: |
          copilot_home="$(mktemp -d)"
          export COPILOT_HOME="$copilot_home"
          npm exec --yes --package @github/copilot@1.0.75 -- copilot plugin marketplace add .
          npm exec --yes --package @github/copilot@1.0.75 -- copilot plugin marketplace browse agent-distro-marketplace
          npm exec --yes --package @github/copilot@1.0.75 -- copilot plugin install agent-distro@agent-distro-marketplace
          npm exec --yes --package @github/copilot@1.0.75 -- copilot plugin list
          test -f "$COPILOT_HOME/installed-plugins/agent-distro-marketplace/agent-distro/skills/agent-distro-foundation/SKILL.md"
