name: verify

on:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - run: npm run fmt:check
      - run: npm run lint
      - run: npm test
      - run: npm run test:proof
      - name: Copilot marketplace smoke
        run: |
          copilot_home="$(mktemp -d)"
          export COPILOT_HOME="$copilot_home"
          npm exec --yes --package @github/copilot@1.0.75 -- copilot plugin marketplace add .
          npm exec --yes --package @github/copilot@1.0.75 -- copilot plugin marketplace browse agent-distro-marketplace
          npm exec --yes --package @github/copilot@1.0.75 -- copilot plugin install agent-distro@agent-distro-marketplace
          npm exec --yes --package @github/copilot@1.0.75 -- copilot plugin list
          test -f "$COPILOT_HOME/installed-plugins/agent-distro-marketplace/agent-distro/skills/agent-distro-debugging/SKILL.md"

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - run: npm run fmt:check
      - run: npm run lint
      - run: npm test
      - run: npm run test:proof
      - name: Copilot marketplace smoke
        run: |
          copilot_home="$(mktemp -d)"
          export COPILOT_HOME="$copilot_home"
          npm exec --yes --package @github/copilot@1.0.75 -- copilot plugin marketplace add .
          npm exec --yes --package @github/copilot@1.0.75 -- copilot plugin marketplace browse agent-distro-marketplace
          npm exec --yes --package @github/copilot@1.0.75 -- copilot plugin install agent-distro@agent-distro-marketplace
          npm exec --yes --package @github/copilot@1.0.75 -- copilot plugin list
          test -f "$COPILOT_HOME/installed-plugins/agent-distro-marketplace/agent-distro/skills/agent-distro-debugging/SKILL.md"

  runtime:
    name: runtime (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        node: [22.22.2, 24.15.0, 26]
    steps:
      - uses: actions/checkout@v4
      # Package under the maintained development baseline before switching to
      # the consumer runtime that this job validates.
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - run: npm pack
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node test/runtime-package.mjs agent-distro-0.0.0.tgz
